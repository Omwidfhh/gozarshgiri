name: Build LATEST Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout latest MAIN
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force latest origin/main
        shell: pwsh
        run: |
          git fetch origin main
          git reset --hard origin/main

          Write-Host "================================="
          Write-Host "BUILDING THIS COMMIT:"
          git log -1 --oneline
          Write-Host "================================="

      - name: Get commit version
        id: version
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Verify latest sales report exists
        shell: pwsh
        run: |
          if (!(Test-Path "backend/sales_percentage_report.py")) {
            throw "sales_percentage_report.py NOT FOUND"
          }

          Select-String `
            -Path "backend/api.py" `
            -Pattern "upload-sales-percentage"

          Select-String `
            -Path "backend/sales_percentage_report.py" `
            -Pattern "Peyda"

          Write-Host "LATEST SALES REPORT VERIFIED"

      - name: Remove old builds
        shell: pwsh
        run: |
          if (Test-Path "build") {
            Remove-Item "build" -Recurse -Force
          }

          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

      - name: Build fresh EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --clean `
            --noconfirm `
            RoyalReportTools.spec

      - name: Add build information
        shell: pwsh
        run: |
          $sha = "${{ steps.version.outputs.sha }}"

          @"
          RoyalReportTools
          Commit: $sha
          Built: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          "@ | Out-File `
            "dist/RoyalReportTools/BUILD_INFO.txt" `
            -Encoding utf8

      - name: Create ZIP
        shell: pwsh
        run: |
          $sha = "${{ steps.version.outputs.sha }}"

          Compress-Archive `
            -Path "dist/RoyalReportTools/*" `
            -DestinationPath "RoyalReportTools-$sha.zip" `
            -Force

      - name: Upload LATEST build
        uses: actions/upload-artifact@v4
        with:
          name: RoyalReportTools-LATEST-${{ steps.version.outputs.sha }}
          path: RoyalReportTools-${{ steps.version.outputs.sha }}.zip
          if-no-files-found: error
          retention-days: 30
