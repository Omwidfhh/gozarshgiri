name: BUILD CURRENT ROYAL REPORT TOOLS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Verify current source
        shell: pwsh
        run: |
          $required = @(
            "backend/sales_percentage_report.py",
            "frontend/elfo-intro-v3.css",
            "frontend/elfo-intro-v3.js",
            "frontend/elfo-walk-v3.png",
            "frontend/elfo-puller-v3.png",
            "frontend/denim-zip-v3.png"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Missing required file: $file" }
          }
          $html = Get-Content frontend/index.html -Raw -Encoding UTF8
          $sales = Get-Content backend/sales_percentage_report.py -Raw -Encoding UTF8
          if ($html -notmatch "elfoIntroV3") { throw "Elfo V3 is not enabled in index.html" }
          if ($html -notmatch "درصد فروش محصولات") { throw "Sales percentage button is missing" }
          if ($sales -notmatch "Peyda") { throw "Peyda output styling is missing" }
          if ($sales -notmatch "موجودی اولیه") { throw "Initial inventory calculation is missing" }
          git log -1 --oneline

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Syntax checks
        shell: pwsh
        run: |
          python -m py_compile `
            backend/api.py `
            backend/launcher.py `
            backend/report.py `
            backend/orders_report.py `
            backend/barcode_report.py `
            backend/sep_report.py `
            backend/price_report.py `
            backend/definition_date_report.py `
            backend/custom_report.py `
            backend/smart_charge_report.py `
            backend/sleep_analysis_report.py `
            backend/sales_percentage_report.py

      - name: Clean build folders
        shell: pwsh
        run: |
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm RoyalReportTools.spec
          if (!(Test-Path "dist/RoyalReportTools/RoyalReportTools.exe")) {
            throw "RoyalReportTools.exe was not created"
          }

      - name: Add build info
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          @"
          RoyalReportTools
          Commit: $sha
          GitHub Run: ${{ github.run_number }}
          Includes: Elfo V3 + Sales Percentage V8
          "@ | Set-Content "dist/RoyalReportTools/BUILD_INFO.txt" -Encoding UTF8

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: RoyalReportTools-Windows-${{ github.run_number }}
          path: dist/RoyalReportTools/
          if-no-files-found: error
          retention-days: 30
