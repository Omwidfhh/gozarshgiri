name: BUILD CURRENT VERSION

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get CURRENT main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force exact latest main
        shell: pwsh
        run: |
          git fetch origin main
          git reset --hard origin/main

          Write-Host "=============================="
          Write-Host "BUILDING:"
          git log -1 --oneline
          Write-Host "=============================="

      - name: Build information
        id: info
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT

          Write-Host "COMMIT = $sha"

          Write-Host "sales_percentage_report.py:"
          Get-FileHash backend/sales_percentage_report.py -Algorithm SHA256

          Write-Host "frontend/index.html:"
          Get-FileHash frontend/index.html -Algorithm SHA256

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Delete ALL old build files
        shell: pwsh
        run: |
          if (Test-Path build) {
            Remove-Item build -Recurse -Force
          }

          if (Test-Path dist) {
            Remove-Item dist -Recurse -Force
          }

          Get-ChildItem -Recurse -Directory -Filter "__pycache__" |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Get-ChildItem -Recurse -Filter "*.pyc" |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Build fresh Windows app
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm RoyalReportTools.spec

          if (!(Test-Path "dist/RoyalReportTools/RoyalReportTools.exe")) {
            throw "RoyalReportTools.exe was not created"
          }

      - name: Put version inside output
        shell: pwsh
        run: |
          $sha = "${{ steps.info.outputs.sha }}"

          @"
          ROYAL REPORT TOOLS

          Commit: $sha
          GitHub Run: ${{ github.run_number }}
          Built from: origin/main
          Built at: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          "@ | Set-Content `
            "dist/RoyalReportTools/BUILD_INFO.txt" `
            -Encoding UTF8

      - name: Make final ZIP
        shell: pwsh
        run: |
          $sha = "${{ steps.info.outputs.sha }}"
          $name = "RoyalReportTools-CURRENT-${{ github.run_number }}-$sha.zip"

          Compress-Archive `
            -Path "dist/RoyalReportTools/*" `
            -DestinationPath $name `
            -Force

          Write-Host "FINAL OUTPUT: $name"

      - name: Upload CURRENT VERSION
        uses: actions/upload-artifact@v4
        with:
          name: RoyalReportTools-CURRENT-${{ github.run_number }}-${{ steps.info.outputs.sha }}
          path: RoyalReportTools-CURRENT-${{ github.run_number }}-${{ steps.info.outputs.sha }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
